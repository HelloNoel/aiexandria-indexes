version: 1
name: Docker
description: 'Official rolling Docker documentation: containers, Dockerfiles, building and publishing images,
  Compose applications, networking, volumes and engine networking.'
entries:
- id: docker-overview
  name: Docker Engine overview
  kind: doc
  path: content/manuals/engine/_index.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: build-and-push-an-image
  name: Build and publish images to a registry
  kind: doc
  path: content/manuals/build/exporters/image-registry.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: containers
  name: Running containers
  kind: doc
  path: _vendor/github.com/docker/cli/docs/reference/run.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: images
  name: Images and Dockerfiles
  kind: doc
  path: content/manuals/build/concepts/dockerfile.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: compose-quick-start
  name: Compose quick start
  kind: doc
  path: content/manuals/compose/gettingstarted.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: compose-networking
  name: Compose networking
  kind: doc
  path: content/manuals/compose/how-tos/networking.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: volumes
  name: Volumes
  kind: doc
  path: content/manuals/engine/storage/volumes.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
- id: engine-networking
  name: Engine networking
  kind: doc
  path: content/manuals/engine/network/_index.md
  repo:
    url: https://github.com/docker/docs.git
    branch: main
    submodules: false
