version: 1
name: Git reference
description: 'Official rolling Git command reference: commits, branches, merges, rebases, stashing, restoring
  files, configuration and remotes. Check installed Git versions for newer options.'
entries:
- id: commits
  name: Commits
  kind: doc
  path: Documentation/git-commit.adoc
  repo:
    url: https://github.com/git/git.git
    branch: master
    submodules: false
- id: branches
  name: Branches
  kind: doc
  path: Documentation/git-branch.adoc
  repo:
    url: https://github.com/git/git.git
    branch: master
    submodules: false
- id: merging
