    url: https://github.com/git/git.git
    branch: master
    submodules: false
- id: stashing
  name: Stashing
  kind: doc
  path: Documentation/git-stash.adoc
  repo:
    url: https://github.com/git/git.git
    branch: master
    submodules: false
- id: restoring-files
  name: Restoring files
  kind: doc
