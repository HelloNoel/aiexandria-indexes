version: 1
name: Kubernetes
description: 'Official rolling Kubernetes documentation: Pods, Deployments, StatefulSets, Services, ConfigMaps,
  Secrets, PersistentVolumes and RBAC authorization. Match feature availability to your cluster version.'
entries:
- id: pods
  name: Pods
  kind: doc
  path: content/en/docs/concepts/workloads/pods/_index.md
  repo:
    url: https://github.com/kubernetes/website.git
    branch: main
    submodules: false
- id: deployments
  name: Deployments
